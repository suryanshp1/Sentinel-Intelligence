services:
  vi-api:
    environment:
      VI_PUBLIC_ORIGIN: https://${VI_PUBLIC_HOST:?Set the public DNS hostname}
  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      VI_PUBLIC_HOST: ${VI_PUBLIC_HOST:?Set the public DNS hostname}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [vi-web]
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
