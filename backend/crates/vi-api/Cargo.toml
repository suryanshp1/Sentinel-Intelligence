[package]
name = "vi-api"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
chrono.workspace = true
vi-core.workspace = true
vi-db.workspace = true
vi-search.workspace = true
axum = "0.8"
base64 = "0.23"
uuid = { version = "1", features = ["v4", "v5"] }
tower-http = { version = "0.6", features = ["fs", "trace", "limit"] }
async-graphql = "7"
utoipa = "5"
vi-ingest.workspace = true
redis = { version = "0.27", features = ["tokio-comp"] }
sha2 = "0.10"
subtle = "2"
futures-util = "0.3"
[[bin]]
name = "vi-server"
path = "src/main.rs"
