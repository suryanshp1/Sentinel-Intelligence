[workspace]
members = ["crates/vi-core", "crates/vi-db", "crates/vi-search", "crates/vi-ingest", "crates/vi-api"]
resolver = "2"
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
vi-core = { path = "crates/vi-core" }
vi-db = { path = "crates/vi-db" }
vi-search = { path = "crates/vi-search" }
vi-ingest = { path = "crates/vi-ingest" }
