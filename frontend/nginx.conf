server {
 listen 8080;
 server_name _;
 root /usr/share/nginx/html;
 client_max_body_size 10m;
 server_tokens off;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header X-Frame-Options DENY always;
 add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
 location /api/ { proxy_pass http://vi-api:8080; proxy_set_header Host $host; proxy_read_timeout 180s; proxy_buffering off; }
 location /api-docs/ { proxy_pass http://vi-api:8080; }
 location /scalar { proxy_pass http://vi-api:8080; }
 location /taxii2/ { proxy_pass http://vi-api:8080; }
 location /health { proxy_pass http://vi-api:8080; }
 location /readyz { proxy_pass http://vi-api:8080; }
 location / { try_files $uri $uri/ /index.html; }
}
